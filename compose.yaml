services:
  ner:
    image: legal-entity-ner:epoch11
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${NER_PORT:-8501}:8501"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: ${NER_MEMORY_LIMIT:-3g}
    memswap_limit: ${NER_MEMORY_SWAP_LIMIT:-4g}
